<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hall of Fame — PuffinLogin</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d19;
      --panel: #15192d;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #1f264d 0%, #0b0d19 72%);
      color: var(--text);
      min-height: 100vh;
      padding: 1.25rem;
    }
    header {
      max-width: 600px;
      margin: 0 auto 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 0.75rem 1rem;
      border-radius: 1rem;
    }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 900;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .nav-link {
      color: #fde047;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 800;
    }
    main {
      max-width: 600px;
      margin: 0 auto;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 1.15rem;
      padding: 1.1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>🏆 Hall of Fame</h1>
    <div class="header-right">
      <a class="nav-link" href="./snake.html">🐍 Snake</a>
      <puffin-login id="puffin-widget" app-id="smurfs-and-dragons" require-login="false"></puffin-login>
    </div>
  </header>

  <main>
    <section class="card">
      <puffin-leaderboard id="hall-of-fame-lb"></puffin-leaderboard>
    </section>
  </main>

  <script type="module" src="./src/puffin-login.js"></script>
</body>
</html>
